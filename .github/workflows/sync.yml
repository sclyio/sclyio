# Scheduled data sync + rating rebuild + publish to Turso.
#
# Keeps the working SQLite database and the Duosmium blob cache in the Actions
# cache so each run is incremental, exports a compact read-only copy, and
# publishes it to Turso (new database, verified, then an atomic pointer flip).
# The Vercel site reads whatever dataset the pointer names; no redeploy needed.
#
# Required repository secrets: TURSO_API_TOKEN, TURSO_ORG.
# Optional repository variables: TURSO_GROUP (default "default").
name: sync-and-rebuild

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full rating rebuild"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore database and source cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sclyio.db
            .cache/duosmium
          key: sclyio-data-${{ github.run_id }}
          restore-keys: sclyio-data-
      - run: npm run db:migrate
      - name: Incremental sync
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild ratings (from earliest affected date)
        run: npm run ratings:rebuild -- ${{ inputs.full && '--full' || '' }}
      - run: npm test
      - name: Backtest (only if the database has no results yet)
        run: NODE_OPTIONS=--max-old-space-size=5120 npm run backtest -- --if-missing
      - name: Save database and source cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/sclyio.db
            .cache/duosmium
          key: sclyio-data-${{ github.run_id }}
      - name: Export read-only deployment database
        run: npm run db:export -- --out dist-data/sclyio.db
      - name: Publish to Turso
        run: npm run publish:turso -- --file dist-data/sclyio.db
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP || 'default' }}
