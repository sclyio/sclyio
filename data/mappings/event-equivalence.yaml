# Cross-season event equivalence (reviewed, version-controlled).
#
# Event definitions are scoped by division and season. A School Potential
# fit may use the prior season's results for an event ONLY when both
# seasons appear in the same group below. Events that rotated out are never
# carried into a replacement event.
#
# Basis for the generated groups (2026-09-27): the event name appears in both
# consecutive seasons of Duosmium's official national event lists
# (data/events-b.csv, data/events-c.csv). Annual rules revisions were NOT
# reviewed event-by-event; remove a group if its rules changed materially.
groups:
  - id: B-up-1984-1985
    division: B
    members:
      - { season: 1984, event: "\"Up" }
      - { season: 1985, event: "\"Up" }
    basis: "Same name in consecutive official national event lists; rules revisions not individually reviewed."
