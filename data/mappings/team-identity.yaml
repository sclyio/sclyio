# Explicit team-identity decisions (version-controlled).
#
# Team numbers are local to one tournament and are never used as identity.
# An unlabeled entry joins the school's highest-ranking LABELED team in that
# division and season (ranked by mean finishing percentile across the team's
# labeled entries), skipping any team that already competed at the same
# tournament. Several unlabeled entries at one tournament are assigned in
# official finishing order. A school with no labeled team that season keeps
# its own "unlabeled" team. Entries that cannot be placed stay unresolved:
# shown in results, excluded from Team Performance until mapped here.
#
# entries: map one tournament entry to a designation, or force it unresolved.
#   - tournament: 2026-01-10_example_invitational_c
#     number: 12
#     designation: "Gold"        # or  unresolved: "reason"
#     reason: "Host confirmed team 12 was the Gold team"
#
# merges: two designations of one school-season are the same team label.
#   - school: example-high-school-springfield-il
#     division: C
#     season: 2026
#     from: "Team A"
#     into: "A"
#     reason: "Host files use both spellings"
entries: []
merges: []
